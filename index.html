<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Pronúncia | Inglês Real</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #071426;
        color: white;

        font-family: Arial, Helvetica, sans-serif;

        padding: 24px;
    }

    .card {
        width: 100%;
        max-width: 520px;

        background: #0d2038;

        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;

        padding: 40px 28px;

        text-align: center;

        box-shadow:
            0 20px 60px rgba(0,0,0,0.30);
    }

    .label {
        color: #ff9f1c;

        font-size: 13px;
        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 2px;

        margin-bottom: 10px;
    }

    h1 {
        margin: 0 0 10px;

        font-size: clamp(36px, 10vw, 58px);

        word-break: break-word;
    }

    .subtitle {
        opacity: 0.65;

        margin-bottom: 32px;
    }

    .buttons {
        display: flex;

        flex-direction: column;

        gap: 12px;
    }

    button {
        width: 100%;

        border: none;

        border-radius: 15px;

        padding: 17px 20px;

        font-size: 17px;
        font-weight: 700;

        cursor: pointer;

        transition: transform 0.15s ease;
    }

    button:active {
        transform: scale(0.98);
    }

    .normal {
        background: #ff9f1c;
        color: #071426;
    }

    .slow {
        background: rgba(255,255,255,0.08);
        color: white;

        border: 1px solid rgba(255,255,255,0.12);
    }

    .status {
        height: 25px;

        margin-top: 22px;

        font-size: 14px;

        opacity: 0.65;
    }

    .brand {
        margin-top: 30px;

        font-size: 13px;

        opacity: 0.45;
    }

</style>
</head>

<body>

<div class="card">

    <div class="label">
        Inglês Real
    </div>

    <h1 id="word">
        Loading...
    </h1>

    <div class="subtitle">
        American English
    </div>

    <div class="buttons">

        <button
            class="normal"
            onclick="speakWord(0.9)"
        >
            ▶ Ouvir pronúncia
        </button>

        <button
            class="slow"
            onclick="speakWord(0.65)"
        >
            🐢 Ouvir devagar
        </button>

    </div>

    <div
        id="status"
        class="status"
    ></div>

    <div class="brand">
        Do Zero às Mil Palavras do Inglês Real
        <br>
        @alefalando
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

let text = params.get("word") || "";

text = text.trim().slice(0, 120);

const wordElement =
    document.getElementById("word");

const statusElement =
    document.getElementById("status");

const synth = window.speechSynthesis;

/*
Mantemos uma referência global.
Isso também ajuda a evitar alguns
comportamentos estranhos de navegadores móveis.
*/
let currentUtterance = null;


/* =========================
   TEXTO DA PÁGINA
========================= */

if (!text) {

    wordElement.textContent =
        "Nenhuma palavra encontrada";

    statusElement.textContent =
        "Abra esta página através do botão de áudio do ebook.";

} else {

    wordElement.textContent = text;

    document.title =
        text + " | Pronúncia";

}


/* =========================
   CARREGAR VOZES
========================= */

let availableVoices = [];

function loadVoices() {

    availableVoices =
        synth.getVoices();

}

/*
Chamamos imediatamente.
*/

loadVoices();


/*
Alguns navegadores carregam
as vozes posteriormente.
*/

if (
    typeof synth.onvoiceschanged !==
    "undefined"
) {

    synth.addEventListener(
        "voiceschanged",
        loadVoices
    );

}


/* =========================
   DETECTAR IPHONE/IPAD
========================= */

function isIOS() {

    return (

        /iPad|iPhone|iPod/.test(
            navigator.userAgent
        )

        ||

        (
            navigator.platform === "MacIntel"
            &&
            navigator.maxTouchPoints > 1
        )

    );

}


/* =========================
   ESCOLHA DA VOZ
========================= */

function getEnglishVoice() {

    /*
    No iPhone deixamos o próprio
    iOS escolher a voz.

    Isso é mais confiável do que
    forçar Samantha/Fred/etc.
    */

    if (isIOS()) {

        return null;

    }


    /*
    Em desktop tentamos selecionar
    uma voz americana.
    */

    const preferred =
        availableVoices.find(
            voice =>

                /^en-US/i.test(voice.lang)

                &&

                /Samantha|Google US English|Aria|Jenny/i
                    .test(voice.name)
        );


    if (preferred) {

        return preferred;

    }


    const american =
        availableVoices.find(
            voice =>
                /^en-US/i.test(voice.lang)
        );


    if (american) {

        return american;

    }


    return availableVoices.find(
        voice =>
            /^en/i.test(voice.lang)
    );

}


/* =========================
   FALAR
========================= */

function speakWord(rate = 0.9) {

    if (!text) {

        return;

    }


    if (
        !("speechSynthesis" in window)
    ) {

        statusElement.textContent =
            "Seu navegador não oferece suporte à pronúncia.";

        return;

    }


    /*
    Safari às vezes deixa o sintetizador
    em estado pausado.
    */

    if (synth.paused) {

        synth.resume();

    }


    /*
    IMPORTANTE:
    não usamos cancel() no iPhone.

    Alguns Safari/iOS podem descartar
    a fala logo depois de cancel().
    */

    if (
        !isIOS()
        &&
        synth.speaking
    ) {

        synth.cancel();

    }


    currentUtterance =
        new SpeechSynthesisUtterance(text);


    currentUtterance.lang =
        "en-US";

    currentUtterance.rate =
        rate;

    currentUtterance.pitch =
        1;

    currentUtterance.volume =
        1;


    const voice =
        getEnglishVoice();


    /*
    No iOS normalmente fica sem
    voice explicitamente definida,
    permitindo ao sistema selecionar
    a voz apropriada para en-US.
    */

    if (voice) {

        currentUtterance.voice =
            voice;

    }


    currentUtterance.onstart =
        function () {

            statusElement.textContent =
                "Reproduzindo...";

        };


    currentUtterance.onend =
        function () {

            statusElement.textContent =
                "";

        };


    currentUtterance.onerror =
        function (event) {

            console.log(
                "Speech error:",
                event.error
            );

            statusElement.textContent =
                "Erro de áudio: "
                + event.error;

        };


    /*
    Esta chamada acontece diretamente
    depois do clique do usuário.
    Isso é importante principalmente
    no Safari/iPhone.
    */

    synth.speak(
        currentUtterance
    );

}

</script>

</body>
</html>
