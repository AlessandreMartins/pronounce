<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#071426"
>

<title>Pronúncia | Inglês Real</title>


<style>

    * {
        box-sizing: border-box;
    }


    html {
        min-height: 100%;
        background: #071426;
    }


    body {

        margin: 0;

        min-height: 100vh;
        min-height: 100dvh;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #071426;
        color: white;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        padding: 24px;
    }


    .card {

        width: 100%;
        max-width: 520px;

        background: #0d2038;

        border:
            1px solid
            rgba(255, 255, 255, 0.08);

        border-radius: 24px;

        padding: 40px 28px;

        text-align: center;

        box-shadow:
            0 20px 60px
            rgba(0, 0, 0, 0.30);
    }


    .label {

        color: #ff9f1c;

        font-size: 13px;
        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 2px;

        margin-bottom: 10px;
    }


    h1 {

        margin:
            0
            0
            10px;

        font-size:
            clamp(
                36px,
                10vw,
                58px
            );

        line-height: 1.1;

        word-break: break-word;
    }


    .subtitle {

        opacity: 0.65;

        margin-bottom: 32px;

        font-size: 16px;
    }


    .buttons {

        display: flex;

        flex-direction: column;

        gap: 12px;
    }


    button {

        width: 100%;

        border: none;

        border-radius: 15px;

        padding: 17px 20px;

        font-size: 17px;
        font-weight: 700;

        cursor: pointer;

        transition:
            transform 0.15s ease,
            opacity 0.15s ease;

        -webkit-tap-highlight-color:
            transparent;

        touch-action: manipulation;
    }


    button:active {
        transform: scale(0.98);
    }


    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }


    .normal {

        background: #ff9f1c;

        color: #071426;
    }


    .slow {

        background:
            rgba(
                255,
                255,
                255,
                0.08
            );

        color: white;

        border:
            1px solid
            rgba(
                255,
                255,
                255,
                0.12
            );
    }


    .status {

        min-height: 25px;

        margin-top: 22px;

        font-size: 14px;

        opacity: 0.65;

        line-height: 1.4;
    }


    .brand {

        margin-top: 30px;

        font-size: 13px;

        line-height: 1.5;

        opacity: 0.45;
    }


    @media (
        max-width: 480px
    ) {

        body {
            padding: 16px;
        }


        .card {

            padding:
                34px
                20px;

            border-radius: 20px;
        }


        button {

            padding:
                18px
                16px;

            font-size: 16px;
        }

    }

</style>

</head>


<body>


<div class="card">


    <div class="label">

        Inglês Real

    </div>


    <h1 id="word">

        Loading...

    </h1>


    <div class="subtitle">

        American English

    </div>


    <div class="buttons">


        <button
            id="normalButton"
            class="normal"
            type="button"
        >

            ▶ Ouvir pronúncia

        </button>


        <button
            id="slowButton"
            class="slow"
            type="button"
        >

            🐢 Ouvir devagar

        </button>


    </div>


    <div
        id="status"
        class="status"
        aria-live="polite"
    ></div>


    <div class="brand">

        Do Zero às Mil Palavras
        do Inglês Real

        <br>

        @alefalando

    </div>


</div>


<script>

"use strict";


/* ==================================================
   CONFIGURAÇÃO DA SESSÃO DE ÁUDIO
   ESPECIALMENTE PARA SAFARI / IOS
================================================== */

function configureAudioSession() {

    try {

        if (
            "audioSession" in navigator
            &&
            navigator.audioSession
        ) {

            navigator.audioSession.type =
                "playback";


            console.log(
                "AudioSession configurada como playback."
            );

        }

    } catch (
        error
    ) {

        console.warn(
            "AudioSession não disponível ou não suportada:",
            error
        );

    }

}


/*
Tentamos configurar assim que
a página carregar.
*/

configureAudioSession();



/* ==================================================
   ELEMENTOS DA PÁGINA
================================================== */

const wordElement =
    document.getElementById(
        "word"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const normalButton =
    document.getElementById(
        "normalButton"
    );


const slowButton =
    document.getElementById(
        "slowButton"
    );



/* ==================================================
   PEGAR A PALAVRA DA URL
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


let text =
    params.get("word") || "";


/*
Remove espaços extras
e impede textos absurdamente grandes.
*/

text =
    text
        .trim()
        .slice(
            0,
            120
        );



/* ==================================================
   MOSTRAR A PALAVRA
================================================== */

if (
    text
) {

    wordElement.textContent =
        text;


    document.title =
        text
        +
        " | Pronúncia";

} else {

    wordElement.textContent =
        "Nenhuma palavra encontrada";


    statusElement.textContent =
        "Abra esta página através do botão de áudio do ebook.";


    normalButton.disabled =
        true;


    slowButton.disabled =
        true;

}



/* ==================================================
   VERIFICAR SUPORTE À VOZ
================================================== */

const speechSupported =

    "speechSynthesis"
    in window

    &&

    "SpeechSynthesisUtterance"
    in window;


const synth =

    speechSupported

        ?

        window.speechSynthesis

        :

        null;



/*
Mantém uma referência global
da fala atual.
*/

let currentUtterance =
    null;


/*
Lista de vozes disponíveis.
*/

let availableVoices =
    [];



/* ==================================================
   DETECTAR IPHONE / IPAD
================================================== */

function isIOS() {

    const userAgent =
        navigator.userAgent
        ||
        "";


    const classicIOSDevice =

        /iPad|iPhone|iPod/i
            .test(
                userAgent
            );


    /*
    Alguns iPads modernos
    se identificam como Mac.
    */

    const modernIPad =

        navigator.platform
        ===
        "MacIntel"

        &&

        navigator.maxTouchPoints
        >
        1;


    return (

        classicIOSDevice

        ||

        modernIPad

    );

}



/* ==================================================
   CARREGAR VOZES
================================================== */

function loadVoices() {

    if (
        !speechSupported
    ) {

        return;

    }


    const voices =
        synth.getVoices();


    if (
        voices.length
        >
        0
    ) {

        availableVoices =
            voices;

    }

}



if (
    speechSupported
) {

    /*
    Primeira tentativa.
    */

    loadVoices();


    /*
    Alguns navegadores carregam
    as vozes posteriormente.
    */

    if (
        typeof
        synth.addEventListener
        ===
        "function"
    ) {

        synth.addEventListener(

            "voiceschanged",

            loadVoices

        );

    }

}



/* ==================================================
   ESCOLHER VOZ EM INGLÊS
================================================== */

function getEnglishVoice() {

    if (
        !speechSupported
    ) {

        return null;

    }


    /*
    NO IOS:

    Não forçamos Samantha,
    Jenny, Aria etc.

    Apenas usamos en-US
    e deixamos o próprio sistema
    escolher uma voz.
    */

    if (
        isIOS()
    ) {

        return null;

    }


    /*
    Atualiza a lista de vozes.
    */

    const currentVoices =
        synth.getVoices();


    if (
        currentVoices.length
        >
        0
    ) {

        availableVoices =
            currentVoices;

    }


    /*
    Primeiro tentamos algumas
    vozes americanas conhecidas.
    */

    const preferredVoice =
        availableVoices.find(

            function (
                voice
            ) {

                return (

                    /^en-US/i
                        .test(
                            voice.lang
                        )

                    &&

                    /Samantha|Google US English|Aria|Jenny|Zira|Ava|Allison/i
                        .test(
                            voice.name
                        )

                );

            }

        );


    if (
        preferredVoice
    ) {

        return preferredVoice;

    }


    /*
    Segundo fallback:
    qualquer voz en-US.
    */

    const americanVoice =
        availableVoices.find(

            function (
                voice
            ) {

                return (

                    /^en-US/i
                        .test(
                            voice.lang
                        )

                );

            }

        );


    if (
        americanVoice
    ) {

        return americanVoice;

    }


    /*
    Último fallback:
    qualquer voz em inglês.
    */

    const englishVoice =
        availableVoices.find(

            function (
                voice
            ) {

                return (

                    /^en/i
                        .test(
                            voice.lang
                        )

                );

            }

        );


    return (

        englishVoice

        ||

        null

    );

}



/* ==================================================
   ATUALIZAR STATUS
================================================== */

function setStatus(
    message
) {

    statusElement.textContent =
        message;

}



/* ==================================================
   FUNÇÃO PRINCIPAL DE PRONÚNCIA
================================================== */

function speakWord(
    rate
) {


    /*
    IMPORTANTE:

    Configuramos novamente
    a AudioSession exatamente
    durante a interação do usuário.

    Isso ajuda principalmente
    no Safari/iPhone.
    */

    configureAudioSession();


    /*
    Sem palavra,
    não fazemos nada.
    */

    if (
        !text
    ) {

        return;

    }


    /*
    Verifica suporte.
    */

    if (
        !speechSupported
    ) {

        setStatus(
            "Seu navegador não oferece suporte à pronúncia."
        );


        return;

    }


    /*
    Safari pode deixar
    speechSynthesis pausado.
    */

    if (
        synth.paused
    ) {

        try {

            synth.resume();

        } catch (
            error
        ) {

            console.warn(
                "Não foi possível retomar o sintetizador:",
                error
            );

        }

    }


    /*
    IMPORTANTE:

    NÃO usamos cancel()
    no iPhone ou iPad.

    Em outros navegadores,
    cancelamos a fala anterior
    antes de começar uma nova.
    */

    if (

        !isIOS()

        &&

        (
            synth.speaking
            ||
            synth.pending
        )

    ) {

        try {

            synth.cancel();

        } catch (
            error
        ) {

            console.warn(
                "Não foi possível cancelar a fala anterior:",
                error
            );

        }

    }


    /*
    Cria a nova fala.
    */

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    /*
    Mantemos uma referência global.
    */

    currentUtterance =
        utterance;


    /*
    Inglês americano.
    */

    utterance.lang =
        "en-US";


    /*
    Velocidade.
    */

    utterance.rate =
        rate;


    /*
    Tom.
    */

    utterance.pitch =
        1;


    /*
    Volume máximo.
    */

    utterance.volume =
        1;


    /*
    No desktop,
    tentamos escolher
    uma boa voz americana.

    No iOS, deixamos automático.
    */

    const voice =
        getEnglishVoice();


    if (
        voice
    ) {

        utterance.voice =
            voice;

    }



    /* ==================================================
       EVENTO: COMEÇOU
    ================================================== */

    utterance.onstart =
        function () {

            setStatus(
                "Reproduzindo..."
            );

        };



    /* ==================================================
       EVENTO: TERMINOU
    ================================================== */

    utterance.onend =
        function () {

            setStatus(
                ""
            );


            if (
                currentUtterance
                ===
                utterance
            ) {

                currentUtterance =
                    null;

            }

        };



    /* ==================================================
       EVENTO: ERRO
    ================================================== */

    utterance.onerror =
        function (
            event
        ) {

            console.error(
                "Erro SpeechSynthesis:",
                event.error
            );


            /*
            Esses erros podem ocorrer
            naturalmente quando uma fala
            é interrompida.
            */

            if (

                event.error
                ===
                "canceled"

                ||

                event.error
                ===
                "interrupted"

            ) {

                setStatus(
                    ""
                );


                return;

            }


            setStatus(
                "Não foi possível reproduzir o áudio."
            );

        };



    /* ==================================================
       REPRODUZIR
    ================================================== */

    try {

        /*
        A chamada acontece diretamente
        durante o clique do usuário.

        Isso é importante para
        Safari e iPhone.
        */

        synth.speak(
            utterance
        );


    } catch (
        error
    ) {

        console.error(
            "Erro ao iniciar reprodução:",
            error
        );


        setStatus(
            "Não foi possível iniciar a pronúncia."
        );

    }

}



/* ==================================================
   BOTÃO — PRONÚNCIA NORMAL
================================================== */

normalButton.addEventListener(

    "click",

    function () {

        speakWord(
            0.9
        );

    }

);



/* ==================================================
   BOTÃO — PRONÚNCIA DEVAGAR
================================================== */

slowButton.addEventListener(

    "click",

    function () {

        speakWord(
            0.65
        );

    }

);



/* ==================================================
   AVISO DE INCOMPATIBILIDADE
================================================== */

if (
    !speechSupported
) {

    normalButton.disabled =
        true;


    slowButton.disabled =
        true;


    setStatus(
        "Este navegador não oferece suporte à pronúncia por voz."
    );

}

</script>


</body>

</html>
