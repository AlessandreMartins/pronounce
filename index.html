<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#071426"
>

<title>Pronúncia | Inglês Real</title>

<style>

    * {
        box-sizing: border-box;
    }

    html {
        min-height: 100%;
        background: #071426;
    }

    body {
        margin: 0;

        min-height: 100vh;
        min-height: 100dvh;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #071426;
        color: white;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        padding: 24px;
    }


    .card {
        width: 100%;
        max-width: 520px;

        background: #0d2038;

        border:
            1px solid
            rgba(255, 255, 255, 0.08);

        border-radius: 24px;

        padding: 40px 28px;

        text-align: center;

        box-shadow:
            0 20px 60px
            rgba(0, 0, 0, 0.30);
    }


    .label {
        color: #ff9f1c;

        font-size: 13px;
        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 2px;

        margin-bottom: 10px;
    }


    h1 {
        margin:
            0
            0
            10px;

        font-size:
            clamp(
                36px,
                10vw,
                58px
            );

        line-height: 1.1;

        word-break: break-word;
    }


    .subtitle {
        opacity: 0.65;

        margin-bottom: 32px;

        font-size: 16px;
    }


    .buttons {
        display: flex;

        flex-direction: column;

        gap: 12px;
    }


    button {
        width: 100%;

        border: none;

        border-radius: 15px;

        padding: 17px 20px;

        font-size: 17px;
        font-weight: 700;

        cursor: pointer;

        transition:
            transform 0.15s ease,
            opacity 0.15s ease;

        -webkit-tap-highlight-color:
            transparent;

        touch-action: manipulation;
    }


    button:active {
        transform: scale(0.98);
    }


    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }


    .normal {
        background: #ff9f1c;
        color: #071426;
    }


    .slow {
        background:
            rgba(
                255,
                255,
                255,
                0.08
            );

        color: white;

        border:
            1px solid
            rgba(
                255,
                255,
                255,
                0.12
            );
    }


    .status {
        min-height: 25px;

        margin-top: 22px;

        font-size: 14px;

        opacity: 0.65;

        line-height: 1.4;
    }


    .brand {
        margin-top: 30px;

        font-size: 13px;

        line-height: 1.5;

        opacity: 0.45;
    }


    @media (
        max-width: 480px
    ) {

        body {
            padding: 16px;
        }

        .card {
            padding:
                34px
                20px;

            border-radius: 20px;
        }

        button {
            padding:
                18px
                16px;

            font-size: 16px;
        }
    }

</style>
</head>

<body>

<div class="card">

    <div class="label">
        Inglês Real
    </div>


    <h1 id="word">
        Loading...
    </h1>


    <div class="subtitle">
        American English
    </div>


    <div class="buttons">

        <button
            id="normalButton"
            class="normal"
            type="button"
        >
            ▶ Ouvir pronúncia
        </button>


        <button
            id="slowButton"
            class="slow"
            type="button"
        >
            🐢 Ouvir devagar
        </button>

    </div>


    <div
        id="status"
        class="status"
        aria-live="polite"
    ></div>


    <div class="brand">

        Do Zero às Mil Palavras
        do Inglês Real

        <br>

        @alefalando

    </div>

</div>


<script>

"use strict";


/* ==================================================
   ELEMENTOS DA PÁGINA
================================================== */

const wordElement =
    document.getElementById(
        "word"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const normalButton =
    document.getElementById(
        "normalButton"
    );


const slowButton =
    document.getElementById(
        "slowButton"
    );


/* ==================================================
   PEGAR A PALAVRA DA URL
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


let text =
    params.get("word") || "";


/*
Limpa espaços extras
e evita textos muito grandes.
*/

text =
    text
        .trim()
        .slice(
            0,
            120
        );


/* ==================================================
   MOSTRAR A PALAVRA
================================================== */

if (text) {

    wordElement.textContent =
        text;


    document.title =
        text
        +
        " | Pronúncia";


} else {

    wordElement.textContent =
        "Nenhuma palavra encontrada";


    statusElement.textContent =
        "Abra esta página através do botão de áudio do ebook.";


    normalButton.disabled =
        true;


    slowButton.disabled =
        true;

}


/* ==================================================
   VERIFICAR SUPORTE A VOZ
================================================== */

const speechSupported =

    "speechSynthesis"
    in window

    &&

    "SpeechSynthesisUtterance"
    in window;


const synth =
    speechSupported
        ?
        window.speechSynthesis
        :
        null;


/*
Mantemos referência global
da fala atual.

Isso ajuda principalmente
em navegadores móveis.
*/

let currentUtterance =
    null;


/*
Lista de vozes disponíveis.
*/

let availableVoices =
    [];


/* ==================================================
   DETECTAR IPHONE / IPAD
================================================== */

function isIOS() {

    const userAgent =
        navigator.userAgent
        ||
        "";


    const oldIOSDevice =
        /iPad|iPhone|iPod/i
            .test(
                userAgent
            );


    /*
    iPads modernos podem se identificar
    como Macintosh.
    */

    const modernIPad =

        navigator.platform
        ===
        "MacIntel"

        &&

        navigator.maxTouchPoints
        >
        1;


    return (
        oldIOSDevice
        ||
        modernIPad
    );

}


/* ==================================================
   CARREGAR VOZES
================================================== */

function loadVoices() {

    if (
        !speechSupported
    ) {

        return;

    }


    const voices =
        synth.getVoices();


    if (
        voices.length
        >
        0
    ) {

        availableVoices =
            voices;

    }

}


/*
Tenta carregar imediatamente.
*/

if (
    speechSupported
) {

    loadVoices();


    /*
    Chrome, Safari e outros
    podem carregar as vozes
    alguns instantes depois.
    */

    if (
        typeof
        synth.addEventListener
        ===
        "function"
    ) {

        synth.addEventListener(
            "voiceschanged",
            loadVoices
        );

    }

}


/* ==================================================
   ESCOLHER VOZ EM INGLÊS
================================================== */

function getEnglishVoice() {

    if (
        !speechSupported
    ) {

        return null;

    }


    /*
    No iPhone/iPad,
    não forçamos uma voz específica.

    O idioma en-US será definido
    na frase e o próprio iOS
    escolherá uma voz compatível.
    */

    if (
        isIOS()
    ) {

        return null;

    }


    /*
    Atualiza a lista antes
    de selecionar.
    */

    const currentVoices =
        synth.getVoices();


    if (
        currentVoices.length
        >
        0
    ) {

        availableVoices =
            currentVoices;

    }


    /*
    Preferimos algumas
    vozes americanas comuns.
    */

    const preferredVoice =
        availableVoices.find(

            function (
                voice
            ) {

                return (

                    /^en-US/i
                        .test(
                            voice.lang
                        )

                    &&

                    /Samantha|Google US English|Aria|Jenny|Zira|Ava|Allison/i
                        .test(
                            voice.name
                        )

                );

            }

        );


    if (
        preferredVoice
    ) {

        return preferredVoice;

    }


    /*
    Se não encontrar uma preferida,
    usa qualquer voz americana.
    */

    const americanVoice =
        availableVoices.find(

            function (
                voice
            ) {

                return (
                    /^en-US/i
                        .test(
                            voice.lang
                        )
                );

            }

        );


    if (
        americanVoice
    ) {

        return americanVoice;

    }


    /*
    Último fallback:
    qualquer voz em inglês.
    */

    const englishVoice =
        availableVoices.find(

            function (
                voice
            ) {

                return (
                    /^en/i
                        .test(
                            voice.lang
                        )
                );

            }

        );


    return (
        englishVoice
        ||
        null
    );

}


/* ==================================================
   ATUALIZAR STATUS
================================================== */

function setStatus(
    message
) {

    statusElement.textContent =
        message;

}


/* ==================================================
   FUNÇÃO PRINCIPAL DE PRONÚNCIA
================================================== */

function speakWord(
    rate
) {

    /*
    Sem palavra,
    não fazemos nada.
    */

    if (
        !text
    ) {

        return;

    }


    /*
    Verifica suporte do navegador.
    */

    if (
        !speechSupported
    ) {

        setStatus(
            "Seu navegador não oferece suporte à pronúncia."
        );


        return;

    }


    /*
    Algumas versões do Safari
    podem deixar o sintetizador
    em estado pausado.
    */

    if (
        synth.paused
    ) {

        try {

            synth.resume();

        } catch (
            error
        ) {

            console.warn(
                "Não foi possível retomar o sintetizador:",
                error
            );

        }

    }


    /*
    IMPORTANTE PARA IOS:

    Não usamos cancel()
    antes da reprodução no iPhone/iPad.

    Em alguns ambientes Safari/iOS,
    cancelar e imediatamente falar
    pode impedir que a nova fala seja
    reproduzida.
    */

    if (
        !isIOS()
        &&
        (
            synth.speaking
            ||
            synth.pending
        )
    ) {

        try {

            synth.cancel();

        } catch (
            error
        ) {

            console.warn(
                "Erro ao cancelar fala anterior:",
                error
            );

        }

    }


    /*
    Criamos uma nova fala.
    */

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    /*
    Mantemos uma referência global.
    */

    currentUtterance =
        utterance;


    /*
    Idioma.
    */

    utterance.lang =
        "en-US";


    /*
    Velocidade.
    */

    utterance.rate =
        rate;


    /*
    Tom natural.
    */

    utterance.pitch =
        1;


    /*
    Volume máximo.
    */

    utterance.volume =
        1;


    /*
    No desktop,
    tentamos selecionar
    uma boa voz americana.
    */

    const voice =
        getEnglishVoice();


    if (
        voice
    ) {

        utterance.voice =
            voice;

    }


    /* ==================================================
       EVENTOS
    ================================================== */

    utterance.onstart =
        function () {

            setStatus(
                "Reproduzindo..."
            );

        };


    utterance.onend =
        function () {

            setStatus(
                ""
            );


            if (
                currentUtterance
                ===
                utterance
            ) {

                currentUtterance =
                    null;

            }

        };


    utterance.onerror =
        function (
            event
        ) {

            console.error(
                "Erro SpeechSynthesis:",
                event.error
            );


            /*
            "canceled" pode acontecer
            normalmente quando uma fala
            anterior é interrompida.
            */

            if (
                event.error
                ===
                "canceled"
            ) {

                setStatus(
                    ""
                );


                return;

            }


            /*
            Alguns navegadores usam
            "interrupted" em situações
            semelhantes.
            */

            if (
                event.error
                ===
                "interrupted"
            ) {

                setStatus(
                    ""
                );


                return;

            }


            setStatus(
                "Não foi possível reproduzir o áudio."
            );

        };


    /* ==================================================
       REPRODUZIR
    ================================================== */

    try {

        /*
        A chamada speak() acontece
        diretamente dentro da função
        acionada pelo toque do usuário.

        Isso é especialmente importante
        no Safari/iPhone.
        */

        synth.speak(
            utterance
        );


    } catch (
        error
    ) {

        console.error(
            "Erro ao iniciar reprodução:",
            error
        );


        setStatus(
            "Não foi possível iniciar a pronúncia."
        );

    }

}


/* ==================================================
   BOTÃO NORMAL
================================================== */

normalButton.addEventListener(

    "click",

    function () {

        speakWord(
            0.9
        );

    }

);


/* ==================================================
   BOTÃO DEVAGAR
================================================== */

slowButton.addEventListener(

    "click",

    function () {

        speakWord(
            0.65
        );

    }

);


/* ==================================================
   AVISO CASO O NAVEGADOR NÃO TENHA SUPORTE
================================================== */

if (
    !speechSupported
) {

    normalButton.disabled =
        true;


    slowButton.disabled =
        true;


    setStatus(
        "Este navegador não oferece suporte à pronúncia por voz."
    );

}

</script>

</body>
</html>
